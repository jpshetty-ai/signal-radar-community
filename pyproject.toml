[project]
name = "signal-radar"
version = "0.1.0"
description = "AI & tech market intelligence: news intake -> knowledge graph -> signals"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jay Shetty" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://jpshetty-ai.github.io/signal-radar-community/"
Source = "https://github.com/jpshetty-ai/signal-radar-community"

[project.optional-dependencies]
# Provider SDKs are optional: install only what config/models.yaml uses.
anthropic = ["anthropic>=1.11"]
openai = ["openai>=1.50"]
# Phase 2+: MCP server and source adapters (msal: Microsoft 365 mail via Graph, ADR-0007). mcp 2.x renamed FastMCP to MCPServer (ADR-0005).
mcp = ["mcp>=2.2,<3", "feedparser>=6.0", "keyring>=25", "msal>=1.30", "msal-extensions>=1.2", "beautifulsoup4>=4.12", "typesafe-sdk>=0.7"]
# Phase 3+: graph. Pinned minor because Graqle ships breaking changes often.
graph = ["graqle>=0.85,<0.86"]
# Vector search (ADR-0019): in-process ONNX embeddings, no PyTorch, no server. numpy for the local fallback search.
vectors = ["fastembed>=0.9,<0.10", "numpy>=1.26"]
# Phase 5: site builder + local console server.
web = ["jinja2>=3.1", "fastapi>=0.110", "uvicorn>=0.30", "numpy>=1.26"]  # numpy: Ask imports vectors.rrf
dev = ["pytest>=8"]

[project.scripts]
signal-radar = "signal_radar.cli:main"
signal-sources-mcp = "signal_radar.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
