# Which model does what. Every LLM call goes through src/signal_radar/llm.py, which reads this file
# (ADR-0002, ADR-0013); scripts/sync_graqle_config.py generates graqle.yaml from it.
#
# CHOOSE YOUR MODELS
# Each role lists catalog ids (see `catalog:` below), tried in order until one answers:
#   extraction  reads every news item once: high volume, structured JSON. Local or a cheap cloud model.
#   reasoning   answers questions in the console (Ask).
#   writing     theme cards and the weekly brief prose.
# The default is fully local and free: Ollama with qwen3:8b (`ollama pull qwen3:8b`). Nothing leaves your machine.
#
#   id                 where it runs                                         needs
#   local              Ollama on this machine (default)                       ollama pull qwen3:8b
#   local-server       LM Studio, llama.cpp, vLLM, Jan: any OpenAI-compatible  the server running; set its model
#                      server on this machine                                 name and port below
#   anthropic-haiku    Anthropic API, cheap and fast                          ANTHROPIC_API_KEY in .env
#   anthropic-sonnet   Anthropic API, strong writing                          ANTHROPIC_API_KEY in .env
#   openai-luna        OpenAI API, cheap                                      OPENAI_API_KEY in .env
#   openrouter-luna    OpenRouter: hundreds of models, one key                OPENROUTER_API_KEY in .env
#   openrouter-sonnet  OpenRouter, Claude Sonnet                              OPENROUTER_API_KEY in .env
#
# Examples:
#   no Ollama, one Anthropic key:   extraction [anthropic-haiku], reasoning and writing [anthropic-sonnet]
#   local extraction, cloud prose:  extraction [local], writing [openrouter-luna, local]
# Cost guide: one extraction is about 1,100 input and 200 output tokens. With anthropic-haiku that is roughly
# $0.0003 per item, so a 100-item day costs about 3 cents. Paid calls stop at the monthly budget below.
#
# Try a model for one run without editing:  signal-radar --model extraction=@anthropic-haiku extract --limit 5
# Any model by name:                         signal-radar --model writing=anthropic/claude-sonnet-5-5 brief
# See what is in effect: signal-radar config.  Smoke test a role: signal-radar llm extraction "ping".
# Using the knowledge graph? After editing, run: python scripts/sync_graqle_config.py
#
# Advanced: a role can rank several candidates with `strategy: cheapest_passing` and `min_quality: 0.85`: the
# cheapest candidate that passed your own evaluation (signal-radar models eval) goes first (ADR-0013).
# A role can also name one model directly: `provider: ollama` + `model: llama3.1:8b` (+ `params:`).

roles:
  extraction:
    candidates: [local]
  reasoning:
    candidates: [local]
  writing:
    candidates: [local]
  embedding:
    # Vector search (optional, ADR-0019): in-process ONNX model, 384 dimensions, 67 MB, MIT. No Ollama needed.
    # BGE is asymmetric: questions get this instruction, stored passages do not (embed(kind="query")).
    provider: fastembed
    model: BAAI/bge-small-en-v1.5
    params:
      query_prefix: "Represent this sentence for searching relevant passages: "
      batch_size: 64

# Paid calls stop when this month's priced spend reaches the cap; roles then fall through to the next candidate.
# Set it to what you are willing to spend; 0 keeps everything local.
budget:
  monthly_usd: 5

providers:
  fastembed: {}                # in-process embeddings; no host, no key
  ollama:
    host_env: OLLAMA_HOST
    default_host: http://localhost:11434
    timeout_s: 300
  local_server:
    # Any OpenAI-compatible server on this machine. Default ports: LM Studio 1234, llama.cpp 8080, vLLM 8000,
    # Jan 1337. No key needed for a localhost server.
    kind: openai
    base_url: http://localhost:1234/v1
    timeout_s: 300
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 600
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: null
    timeout_s: 600
  openrouter:
    # One key, many models. Key: OPENROUTER_API_KEY in .env, or the macOS keychain
    # (security add-generic-password -s signal-radar -a OPENROUTER_API_KEY -w).
    kind: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 180
    headers: {X-Title: Signal Radar}
    extra_body:
      provider:
        data_collection: deny      # only providers that do not store or train on prompts
        zdr: true                  # zero data retention endpoints only
        require_parameters: true   # only providers that support structured output for our schema

# Model catalog. Prices in USD per 1M tokens (list prices, checked 2026-10-31). Add your own entries freely:
# any Ollama model (`ollama list`), any OpenRouter id (openrouter.ai/models), any model your local server loads.
catalog:
  local:
    provider: ollama
    model: qwen3:8b
    params: {temperature: 0, think: false, num_ctx: 8192}   # qwen3 reasoning off for bulk extraction
    price: {input: 0, output: 0}
    data_policy: local, nothing leaves this machine
  local-server:
    provider: local_server
    model: qwen3-8b              # the model id your server shows (LM Studio: the loaded model's identifier)
    params: {temperature: 0}
    price: {input: 0, output: 0}
    data_policy: local, nothing leaves this machine
  anthropic-haiku:
    provider: anthropic
    model: claude-haiku-5-5
    params: {max_tokens: 4000, effort: low}   # no temperature: the API rejects it
    price: {input: 0.10, output: 0.50}
    data_policy: Anthropic API
  anthropic-sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    params: {max_tokens: 8000, effort: medium, fallbacks: default}   # fallbacks: retried on another model if declined
    price: {input: 2.00, output: 10.00, cache_read: 0.20}
    data_policy: Anthropic API
  openai-luna:
    provider: openai
    model: gpt-6-luna
    params: {max_completion_tokens: 4000}     # no temperature: rejected by this model family
    price: {input: 0.10, output: 0.50}
    data_policy: OpenAI API
  openrouter-luna:
    provider: openrouter
    model: openai/gpt-6-luna
    params: {max_tokens: 4000}   # no temperature: rejected, and require_parameters then finds no endpoint
    price: {input: 0.10, output: 0.50}
    data_policy: OpenRouter, no-retention providers only
    notes: the author's evaluation (blind-graded) rated it 0.94 for reasoning and 0.92 for writing
  openrouter-sonnet:
    provider: openrouter
    model: anthropic/claude-sonnet-5.5
    params: {max_tokens: 4000}   # no temperature: rejected, and require_parameters then finds no endpoint
    price: {input: 2.00, output: 10.00}
    data_policy: OpenRouter, no-retention providers only

# Judges for `signal-radar models eval --judge <id>`: non-chat models that grade outputs (ADR-0013).
# Catalog models can judge too (--judge anthropic-sonnet); this one is a cheaper, typed alternative.
judges:
  jev:
    kind: typesafe
    model: jev-1.13.0
    api_key_env: TYPESAFE_API_KEY      # .env or keychain: security add-generic-password -s signal-radar -a TYPESAFE_API_KEY -w
    price_input_per_million: 0.042     # output tokens are free (docs.typesafe.ai/models, 2026-10-04)

# Prices for models named directly (`provider/model` roles and --model overrides). Unknown -> cost logged as null.
pricing:
  anthropic/claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
  anthropic/claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}
  anthropic/claude-haiku-5-5: {input: 0.10, output: 0.50}
  openai/gpt-6-luna: {input: 0.10, output: 0.50}
  ollama/*: {input: 0, output: 0}
  local_server/*: {input: 0, output: 0}
