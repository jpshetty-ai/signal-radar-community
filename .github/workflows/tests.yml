name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    # what a default install runs, on both supported Pythons, plus the full demo pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[anthropic,openai,mcp,web,dev]'
      - run: pytest -q
      - name: demo pipeline (synthetic corpus -> signals -> brief -> sites)
        run: python scripts/demo.py
  optional-tiers:
    # knowledge graph, Neo4j sync and vector code paths (no Neo4j server needed: the tests use fakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[anthropic,openai,mcp,web,graph,vectors,dev]'
      - run: pytest -q -rs
